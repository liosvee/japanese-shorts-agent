[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "japanese-shorts-agent"
version = "0.2.0"
description = "Evidence-led Japanese YouTube research and original Shorts production for Claude Code"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["evolution*", "jp_shorts*", "elmarketing*"]


[tool.setuptools.package-data]
evolution = ["config.json", "WORKFLOW.md", "SCHEMA.md", "knowledge/*.json", "knowledge/*.md"]
